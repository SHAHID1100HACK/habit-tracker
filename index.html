<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HabitMentor</title>
    
    <!-- PWA Manifest and Service Worker for Android APK Build -->
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--bg-color); padding: 20px;">
    
    <div class="hero-card" style="width: 100%; max-width: 400px; flex-direction: column; gap: 24px; padding: 32px; background: var(--surface-color); border: 1px solid var(--border-color); margin: 0 auto;">
        
        <div style="text-align: center;">
            <h1 style="margin-bottom: 8px;">HabitMentor</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Sign in to access your dashboard</p>
        </div>

        <form id="authForm" style="display: flex; flex-direction: column; gap: 16px; width: 100%;">
            <div class="input-group">
                <label for="emailInput">Email</label>
                <input type="email" id="emailInput" required placeholder="Enter your email">
            </div>
            
            <div class="input-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" required placeholder="Enter your password">
            </div>

            <div class="input-group" id="usernameGroup" style="display: none;">
                <label for="usernameInput">Username</label>
                <input type="text" id="usernameInput" placeholder="Choose a username">
            </div>

            <p id="authError" style="color: var(--danger); font-size: 13px; margin: 0; text-align: center;"></p>

            <button type="submit" id="signInBtn" class="btn-primary" style="width: 100%;">Sign In</button>
            <button type="button" id="toggleSignUpBtn" class="btn-secondary" style="width: 100%;">Need an account? Sign Up</button>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
