<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Board | HabitMentor</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container dashboard-container">
        <!-- Header -->
        <header class="dash-header">
            <div>
                <p class="date-text">Long-Term Focus</p>
                <h1>Vision Board</h1>
            </div>
        </header>

        <!-- Clean Add Goal Section -->
        <div style="background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; margin-bottom: 32px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
            <h2 style="font-size: 18px; margin-bottom: 8px; color: var(--text-primary);">Define Your Target</h2>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">The AI will break this down into actionable daily tasks for you.</p>
            
            <form id="goalForm" style="width: 100%; display: flex; flex-direction: column; gap: 12px;">
                <textarea id="goalInput" required rows="3" placeholder="e.g., Get an entry-level job in cybersecurity by building a SOC lab..." style="width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--surface-2); color: var(--text-primary); font-family: inherit; resize: none; outline: none;"></textarea>
                <button type="submit" id="saveGoalBtn" class="btn-primary" style="margin-top: 8px;">Lock in Goal 🎯</button>
            </form>
        </div>

        <!-- Saved Goals List -->
        <div class="timeline-section" style="margin-bottom: 80px;">
            <h3 style="font-size: 16px; color: var(--text-secondary); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px;">Active Targets</h3>
            <div id="goalList" class="task-list">
                <!-- Goals will inject here -->
                <p class="empty-state">No targets set yet. Define your vision above!</p>
            </div>
        </div>

        <!-- Fixed Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">🏠</a>
            <a href="goals.html" class="nav-item active">🎯</a>
            <a href="dashboard.html" class="fab-button" style="text-decoration: none;">+</a>
            <a href="chat.html" class="nav-item">💬</a>
            <a href="achievements.html" class="nav-item">🏆</a>
        </nav>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/goals.js"></script>
</body>
</html>
