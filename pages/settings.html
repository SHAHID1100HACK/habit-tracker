<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | HabitMentor</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container dashboard-container">
        <!-- Header -->
        <header class="dash-header">
            <div>
                <p class="date-text">Preferences</p>
                <h1>Settings</h1>
            </div>
            <a href="dashboard.html" class="btn-primary" style="text-decoration: none; padding: 8px 16px; width: auto; background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border-color);">Done</a>
        </header>

        <!-- Edit Profile Card -->
        <div class="hero-card" style="flex-direction: column; align-items: flex-start; gap: 20px; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-primary); box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
            <h2 style="color: var(--text-primary); font-size: 18px; margin-bottom: 0;">Profile Information</h2>
            
            <!-- NEW: PFP Upload Section -->
            <div style="display: flex; align-items: center; gap: 16px; width: 100%;">
                <div id="avatarPreview" class="avatar-circle" style="width: 64px; height: 64px; font-size: 24px; overflow: hidden; display: flex; justify-content: center; align-items: center;">?</div>
                <div style="flex-grow: 1;">
                    <label for="avatarUpload" class="btn-secondary" style="display: inline-block; cursor: pointer; padding: 6px 12px; font-size: 12px; width: auto; margin-bottom: 4px;">Choose Picture</label>
                    <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
                    <p style="font-size: 11px; color: var(--text-secondary); margin: 0;">JPEG or PNG</p>
                </div>
            </div>

            <p id="uploadStatus" style="font-size: 13px; margin: 0;"></p>
            
            <div class="input-group" style="width: 100%;">
                <label for="usernameInput" style="color: var(--text-secondary);">Display Name</label>
                <input type="text" id="usernameInput" placeholder="Loading...">
            </div>
            <button id="saveProfileBtn" class="btn-primary" style="width: 100%;">Save Changes</button>
        </div>

        <!-- Logout Section -->
        <div class="hero-card" style="flex-direction: column; align-items: flex-start; gap: 16px; background: var(--surface-color); border: 1px solid rgba(255, 107, 107, 0.3); color: var(--text-primary); box-shadow: none; margin-top: 24px;">
            <h2 style="color: var(--danger); font-size: 18px; margin-bottom: 0;">Security</h2>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 0;">Securely end your session on this device.</p>
            <button id="logoutBtn" style="background: rgba(255, 107, 107, 0.1); border: 1px solid var(--danger); padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; color: var(--danger); font-weight: bold; transition: all 0.2s;">Log Out</button>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/settings.js"></script>
</body>
</html>
